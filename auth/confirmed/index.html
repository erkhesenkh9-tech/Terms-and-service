<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Account confirmed — Vezo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F2F1EF;
      color: #111;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    .badge {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #F2F1EF;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: #E4573D;
    }
    h1 { margin: 0 0 12px; font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
    p { margin: 0; font-size: 16px; line-height: 1.5; color: #666; }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">✓</div>
    <h1>Account confirmed</h1>
    <p>You can close this tab and open Vezo to sign in.</p>
  </main>
</body>
</html>
