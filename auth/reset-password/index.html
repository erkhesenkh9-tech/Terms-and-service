<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Vezo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #F2F1EF;
      color: #111;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border-radius: 20px;
      padding: 32px 28px;
      border: 1px solid rgba(0, 0, 0, 0.08);
    }
    h1 { margin: 0 0 8px; font-size: 24px; font-weight: 800; }
    p { margin: 0 0 16px; font-size: 15px; line-height: 1.5; color: #666; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { color: #c0392b; font-size: 14px; margin-bottom: 12px; }
    .success { color: #1a7f37; font-size: 14px; }
    .fallback { margin-top: 16px; font-size: 14px; color: #666; }
    a { color: #E4573D; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Reset password</h1>
    <p id="intro">Choose a new password for your Vezo account.</p>
    <p id="error" class="error" hidden></p>
    <form id="form" hidden>
      <label for="password">New password</label>
      <input id="password" type="password" minlength="6" required autocomplete="new-password" />
      <label for="confirm">Confirm password</label>
      <input id="confirm" type="password" minlength="6" required autocomplete="new-password" />
      <button type="submit" id="submit">Update password</button>
    </form>
    <p id="success" class="success" hidden>Password updated. You can close this tab and sign in to Vezo.</p>
    <p class="fallback" id="fallback" hidden>
      On your phone? <a id="deeplink" href="#">Open in the Vezo app</a>
    </p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://hrhsfguhoglyissbcrtf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_tCn9zdhMqWLet-OpwkJjfQ_p0aI2LOQ';

    const params = new URLSearchParams(window.location.search);
    const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
    const code = params.get('code') || hash.get('code');
    const tokenHash = params.get('token_hash') || hash.get('token_hash');
    const type = params.get('type') || hash.get('type');

    const intro = document.getElementById('intro');
    const form = document.getElementById('form');
    const errorEl = document.getElementById('error');
    const successEl = document.getElementById('success');
    const fallback = document.getElementById('fallback');
    const deeplink = document.getElementById('deeplink');

    const qs = window.location.search + window.location.hash;
    deeplink.href = 'vezo://auth/reset-password' + qs;
    fallback.hidden = false;

    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function establishSession() {
      if (code) {
        const { error } = await client.auth.exchangeCodeForSession(code);
        if (error) throw error;
        return;
      }
      if (tokenHash && type) {
        const { error } = await client.auth.verifyOtp({ token_hash: tokenHash, type });
        if (error) throw error;
        return;
      }
      const { data } = await client.auth.getSession();
      if (!data.session) {
        throw new Error('This reset link is invalid or expired. Request a new one from Vezo.');
      }
    }

    (async () => {
      try {
        await establishSession();
        form.hidden = false;
      } catch (e) {
        intro.textContent = 'Could not verify this reset link.';
        errorEl.textContent = e.message || 'Invalid or expired link.';
        errorEl.hidden = false;
      }
    })();

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.hidden = true;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;
      if (password.length < 6) {
        errorEl.textContent = 'Password must be at least 6 characters.';
        errorEl.hidden = false;
        return;
      }
      if (password !== confirm) {
        errorEl.textContent = 'Passwords do not match.';
        errorEl.hidden = false;
        return;
      }
      const submit = document.getElementById('submit');
      submit.disabled = true;
      const { error } = await client.auth.updateUser({ password });
      submit.disabled = false;
      if (error) {
        errorEl.textContent = error.message;
        errorEl.hidden = false;
        return;
      }
      form.hidden = true;
      intro.hidden = true;
      successEl.hidden = false;
    });
  </script>
</body>
</html>
